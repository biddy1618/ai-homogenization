name: homogenization-tracker

on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday 06:17 UTC
  workflow_dispatch: {}     # allow manual runs from the Actions tab

permissions:
  contents: write            # to commit the appended CSVs

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest   # GitHub-hosted runner — no infra to maintain
    env:
      # Optional: if these repo secrets exist, each run's page texts are kept in the private S3 bucket
      # (never in this public repo), one file per run date, so metrics can be recomputed later.
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
      AWS_DEFAULT_REGION: us-west-2
      PAGE_BUCKET: s3://biddy-homogenization/tracker/pages/
    steps:
      - uses: actions/checkout@v4

      - name: Fix the run date
        run: echo "RUN_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache MiniLM ONNX model
        uses: actions/cache@v4
        with:
          path: data/models
          key: minilm-onnx-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==2.5.1" "fastembed==0.8.0" "onnxruntime==1.28.0" "beautifulsoup4>=4.12"

      - name: Run tracker
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: >
          python tracker/tracker.py --provider serper --date "$RUN_DATE"
          --queries tracker/queries.txt --out-dir tracker/data
          --location "United States" --device desktop --num 10

      # Only this run date's texts are restored (a re-run of the same day); earlier weeks are never
      # reused, so every week reads the pages as they are that week.
      - name: Restore this run's page texts from S3 (optional)
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: |
          mkdir -p tracker/data/pages
          if aws s3 cp "${PAGE_BUCKET}${RUN_DATE}.jsonl.gz" tracker/data/pages/ --only-show-errors; then
            python tracker/pagestore.py unpack --date "$RUN_DATE"
          else
            echo "No stored texts for $RUN_DATE (first run of the day)."
          fi

      - name: Full-page metrics (first 5 readable pages per question)
        env:
          SCRAPING_ROBOT_API_KEY: ${{ secrets.SCRAPING_ROBOT_API_KEY }}
        run: python tracker/fullpage.py --provider scrapingrobot --top-k 5 --date "$RUN_DATE"

      - name: Save this run's page texts to S3 (optional)
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: |
          python tracker/pagestore.py pack --date "$RUN_DATE"
          aws s3 cp "tracker/data/pages/${RUN_DATE}.jsonl.gz" "$PAGE_BUCKET" --only-show-errors

      - name: Build dashboard
        run: python tracker/dashboard/build.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tracker/data tracker/dashboard/index.html
          if git diff --cached --quiet; then
            echo "No new tracker data to commit."
          else
            git commit -m "tracker: results $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
