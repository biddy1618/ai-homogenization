name: homogenization-tracker

on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday 06:17 UTC
  workflow_dispatch: {}     # allow manual runs from the Actions tab

permissions:
  contents: write            # to commit the appended CSVs

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest   # GitHub-hosted runner — no infra to maintain
    env:
      # Optional: if these repo secrets exist, page texts are kept in the private S3 bucket (never
      # in this public repo) so any metric can be recomputed later without re-fetching.
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-west-2
      PAGE_BUCKET: s3://biddy-homogenization/tracker/pagecache/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache MiniLM ONNX model
        uses: actions/cache@v4
        with:
          path: data/models
          key: minilm-onnx-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==2.5.1" "fastembed==0.8.0" "onnxruntime==1.28.0" "beautifulsoup4>=4.12"

      - name: Run tracker
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: >
          python tracker/tracker.py --provider serper
          --queries tracker/queries.txt --out-dir tracker/data
          --location "United States" --device desktop --num 10

      - name: Restore page cache from S3 (optional)
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: aws s3 sync "$PAGE_BUCKET" tracker/data/pagecache --only-show-errors

      - name: Full-page metrics (first 5 readable pages per question)
        env:
          SCRAPING_ROBOT_API_KEY: ${{ secrets.SCRAPING_ROBOT_API_KEY }}
        run: python tracker/fullpage.py --provider scrapingrobot --top-k 5 --date "$(date -u +%Y-%m-%d)"

      - name: Save page cache to S3 (optional)
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: aws s3 sync tracker/data/pagecache "$PAGE_BUCKET" --only-show-errors

      - name: Build dashboard
        run: python tracker/dashboard/build.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tracker/data tracker/dashboard/index.html
          if git diff --cached --quiet; then
            echo "No new tracker data to commit."
          else
            git commit -m "tracker: results $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
