name: homogenization-tracker

on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday 06:17 UTC
  workflow_dispatch: {}     # allow manual runs from the Actions tab

permissions:
  contents: write            # to commit the appended CSVs

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest   # GitHub-hosted runner — no infra to maintain
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache MiniLM ONNX model
        uses: actions/cache@v4
        with:
          path: data/models
          key: minilm-onnx-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy fastembed

      - name: Run tracker
        env:
          SERPAPI_KEY: ${{ secrets.SERP_API_KEY }}
        run: python tracker/tracker.py --queries tracker/queries.txt --out-dir tracker/data

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tracker/data
          if git diff --cached --quiet; then
            echo "No new tracker data to commit."
          else
            git commit -m "tracker: results $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
